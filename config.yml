# Конфиг agent-box: пределы движка автоцикла, порог раздела документации и модели помощников оркестратора, один на все проекты машины.
# Движок agent-loop.sh читает файл рядом с собой при старте запуска и называет путь и действующие пределы в строке старта; правка действует со следующего запуска.
# Сессиям в контейнере порог доходит копией /etc/claude-box/config.yml: её кладёт скрипт запуска контейнера при каждом старте.
# Оркестратор /box-orchestrate берёт модели помощников из этого файла при старте сессии.
# Строка — «ключ: значение»: у пределов и порога — целое число, у моделей — алиас модели. Ключа нет — значение по умолчанию, оно и стоит ниже. Неизвестный ключ или значение не того вида — движок не стартует и называет строку.

# итераций за запуск движка
max_iterations: 15

# секунд паузы между итерациями — окно чистой остановки Ctrl+C
pause_seconds: 10

# итераций подряд без прогресса до остановки цикла
max_idle_iterations: 3

# потолок ходов одной итерации
max_turns: 200

# минут итерации до уведомления «итерация идёт дольше»; итерация продолжается
alert_minutes: 60

# порог раздела документации, знаков: архитектура или правила длиннее — делятся по областям кода
split_chars: 50000

# модель агента страницы — подагента оркестратора, который ведёт страницу задачи на claude.ai: opus, sonnet, haiku или fable
page_agent_model: sonnet

# модель агента проверок — подагента оркестратора, который проверяет вопрос блокера: opus, sonnet, haiku или fable
check_agent_model: sonnet
