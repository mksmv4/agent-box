# Настройки обвязки agent-box проекта: пределы движка автоцикла и порог раздела документации, общие для всех разработчиков.
# Движок agent-loop.sh читает файл при старте запуска и называет действующие пределы в строке старта; правка действует со следующего запуска.
# Строка — «ключ: целое число»; ключа нет — значение по умолчанию, оно и стоит ниже. Неизвестный ключ или не число — движок не стартует и называет строку.
# Правит человек: правило запрета в .claude/settings.json закрывает файл агенту.

# итераций за запуск движка
max_iterations: 10

# секунд паузы между итерациями — окно чистой остановки Ctrl+C
pause_seconds: 10

# итераций подряд без прогресса до остановки цикла
max_idle_iterations: 3

# потолок ходов одной итерации
max_turns: 200

# минут итерации до уведомления «итерация идёт дольше»; итерация продолжается
alert_minutes: 60

# порог раздела документации, знаков: архитектура или правила длиннее — делятся по областям кода
split_chars: 50000
