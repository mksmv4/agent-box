# Claude Code в контейнере, файл этой машины под .gitignore проекта: docker compose -f claude-box.yml run --rm claude [флаги claude]
# Файл собирает box-update в папке проекта из этого образца: <проект> ниже — имя проекта Compose из docker compose config проекта — основной compose-файл, дополнение compose.override.yml или список COMPOSE_FILE в .env, — у проекта без compose-файла — имя папки.
# Правка руками, кроме строк CLAUDE_BOX_ALLOW и ANTHROPIC_MODEL, останавливает box-update: последняя строка файла — его сумма без этих строк.
# Своё имя проекта Compose — <проект>-claude: запуск Claude сверяет с этим файлом только ресурсы проекта Claude, контейнеры и сети основного compose-файла остаются как есть,
# и --remove-orphans в запуске Claude базу проекта оставляет.
# Строка COMPOSE_PROJECT_NAME в .env проекта сильнее строки name: и возвращает Claude в проект основного файла: имя проекта — в строке name: основного файла.
name: <проект>-claude
services:
  claude:
    image: maksim44/claude-box
    # запуск только командой run: docker compose -f claude-box.yml up сервис пропускает
    profiles: [claude]
    stdin_open: true
    tty: true
    # права ограничения сети для итераций движка: правила ставит часть запуска от root, процессам node права недоступны
    cap_add: [NET_ADMIN, NET_RAW]
    # модель сессий контейнера: переменная выше настроек, которые скрипт запуска копирует с хоста, — туда /model по Enter в любой сессии пишет свой выбор.
    # Варианты — псевдонимы Claude Code: opus, sonnet, haiku, fable; полное имя вроде claude-opus-5-5 закрепляет версию
    environment:
      ANTHROPIC_MODEL: opus
    # .env проекта читает скрипт запуска и отдаёт переменные Claude Code; строка env_file отдаёт их и части запуска от root: PATH или LD_PRELOAD из .env выполнят программу агента с правами root
    # папка проекта — /workspace/<проект>, явной строкой: строка name: выше даёт Claude своё имя проекта, а путь остаётся путём от имени проекта основного файла; сессии, автопамять и доверие Claude Code в общей домашней папке привязаны к пути
    working_dir: /workspace/<проект>
    volumes:
      - .:/workspace/<проект>
      # только на чтение поверх папки проекта: этот файл задаёт контейнер следующего запуска, настройки и хуки git выполняет git хоста, строка списка исключений .git/info/exclude прячет файл от git без следа в файлах проекта — её дописывает человек на хосте
      - ./claude-box.yml:/workspace/<проект>/claude-box.yml:ro
      # в дополнительной рабочей копии git (.git — файл со строкой gitdir:) на месте трёх строк ниже — .git основного репозитория по его абсолютному пути и поверх только на чтение его config, hooks, info; их пишет box-update
      - ./.git/config:/workspace/<проект>/.git/config:ro
      - ./.git/hooks:/workspace/<проект>/.git/hooks:ro
      - ./.git/info:/workspace/<проект>/.git/info:ro
      # домашняя папка контейнера, общая для всех проектов машины: логин, история сессий, сам Claude Code
      - ~/.claude-box:/home/node
      # домашняя папка хоста, только на чтение: скрипт запуска берёт оттуда CLAUDE.md, хуки, строку состояния, настройки и .gitconfig — что найдёт; агенту она закрыта
      - ~:/root/host-home:ro
# сеть по умолчанию — сеть проекта: Claude в сети сервисов основного compose-файла, база доступна по имени сервиса.
# Блок box-update берёт из docker compose config проекта — networks: default: с именем и настройками, записью JSON: YAML читает её как есть; у проекта без compose-файла блока нет.
# Нет сети — запуск Claude создаёт её по этому блоку, есть — входит в неё; проект, поднятый после Claude, встаёт в ту же сеть с настройками блока.
# Проект сменил имя или настройки сети — блок отстаёт до следующего box-update.
# Запуск Claude в сеть проекта — и запуск проекта в сеть, созданную Claude, — печатает «a network with name … exists but was not created for project …»
# с советом external: true: предупреждение безвредно, а внешнюю сеть Compose не создаёт, и Claude без поднятого проекта не стартует.
networks:
  default:
    name: <проект>_default
